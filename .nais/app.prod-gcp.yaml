spec:
  replicas:
    min: 1
    max: 10
    cpuThresholdPercentage: 90
    scalingStrategy:
      kafka:
        topic: tsm.sykmeldinger
        consumerGroup: tsm-bq-sink
        threshold: 10000

  resources:
    requests:
      cpu: 350m
      memory: 690Mi
    limits:
      memory: 1Gi

  gcp:
    bigQueryDatasets:
      - name: tsm_kafka_sink
        permission: READWRITE

  kafka:
    pool: nav-prod
