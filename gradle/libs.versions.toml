[versions]
kotlin = "2.4.20"
logback = "1.6.5"
logbackEncoder = "9.0"
bigquery = "2.73.0"
bigquerystorage = "3.35.0"

# Testing
mockk = "1.14.11"
testcontainers = "2.0.5"

[libraries]
# Database
google-cloud-bigquery = { module = "com.google.cloud:google-cloud-bigquery", version.ref = "bigquery" }
google-cloud-bigquerystorage = { module = "com.google.cloud:google-cloud-bigquerystorage", version.ref = "bigquerystorage" }

# Monitoring and observability
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
logback-encoder = { module = "net.logstash.logback:logstash-logback-encoder", version.ref = "logbackEncoder" }

# Testing
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
testcontainers-gcloud = { module = "org.testcontainers:testcontainers-gcloud", version.ref = "testcontainers" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
